<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #040811; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const BG = '#040811', PANEL = '#070e1b', BORDER = '#162233';
const GREEN = '#22c55e', RED = '#ef4444', YELLOW = '#f59e0b';
const BLUE = '#60a5fa', CYAN = '#22d3ee';
const WHITE = '#dceef8', MUTED = '#3d5570', DIM = '#0f1f32';

// Glucose profile — t ∈ [0,1] → mg/dL
// baseline 108 → meal spike 226 → PID correction → stable 118
function glucose(t) {
  const w = ((t % 1) + 1) % 1;
  if (w < 0.13) {
    return 108 + Math.sin(w * 53) * 2.5;
  } else if (w < 0.22) {
    const u = (w - 0.13) / 0.09;
    return 108 + 12 * u;
  } else if (w < 0.41) {
    const u = (w - 0.22) / 0.19;
    return 120 + 106 * Math.pow(u, 0.62);
  } else if (w < 0.76) {
    const u = (w - 0.41) / 0.35;
    return 120 + 106 * Math.exp(-4.0 * u) + Math.sin(w * 38) * 3.5 * (1 - Math.min(1, u * 1.5));
  } else if (w < 0.90) {
    return 118 + Math.sin(w * 28) * 2.5;
  } else {
    const u = (w - 0.90) / 0.10;
    return 118 - 10 * u;
  }
}

// Glucose → chart Y
function gy(g, top, h) {
  return top + h * (1 - (g - 40) / 260);
}

const CYCLE = 13000;
const WINDOW = 0.37; // fraction of cycle visible in chart
let t0 = null;

function draw(ts) {
  if (!t0) t0 = ts;
  const t = ((ts - t0) % CYCLE) / CYCLE;
  const W = canvas.width, H = canvas.height;

  // Layout
  const HDR = Math.max(36, Math.round(H * 0.10));
  const FTR = Math.max(26, Math.round(H * 0.08));
  const LFT = Math.max(130, Math.min(Math.round(W * 0.27), 190));
  const PAD = 8;
  const cX = LFT + PAD, cY = HDR + PAD;
  const cW = W - cX - PAD, cH = H - HDR - FTR - PAD * 2;
  const cR = cX + cW, cB = cY + cH;

  // State
  const gNow  = glucose(t);
  const gPrev = glucose(Math.max(0, t - 0.015));
  const delta = gNow - gPrev;
  const isMeal = t > 0.20 && t < 0.44;
  const isPID  = t > 0.38 && t < 0.77;
  const gColor = gNow > 140 ? YELLOW : gNow < 70 ? RED : GREEN;
  const arrow  = delta > 4 ? '↑↑' : delta > 1.5 ? '↗' : delta < -4 ? '↓↓' : delta < -1.5 ? '↘' : '→';
  const statusTxt = gNow > 140 ? 'HYPER' : gNow < 70 ? 'HYPO' : 'IN RANGE';

  // ── Clear ─────────────────────────────────────────────
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  // ── Header ────────────────────────────────────────────
  ctx.fillStyle = PANEL;
  ctx.fillRect(0, 0, W, HDR);
  ctx.strokeStyle = BORDER;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, HDR); ctx.lineTo(W, HDR); ctx.stroke();

  const hFS = Math.max(9, Math.round(HDR * 0.33));
  ctx.textBaseline = 'middle';

  if (Math.sin(ts * 0.005) > 0) {
    ctx.fillStyle = GREEN;
    ctx.beginPath(); ctx.arc(14, HDR / 2, hFS * 0.38, 0, Math.PI * 2); ctx.fill();
  }
  ctx.font = `bold ${hFS}px "Courier New",monospace`;
  ctx.fillStyle = GREEN;
  ctx.textAlign = 'left';
  ctx.fillText('  CLOSED LOOP ACTIVE', 12, HDR / 2);

  ctx.font = `${hFS - 1}px "Courier New",monospace`;
  ctx.fillStyle = MUTED;
  ctx.textAlign = 'center';
  ctx.fillText('PID · ZIEGLER-NICHOLS', W / 2, HDR / 2);

  ctx.textAlign = 'right';
  ctx.fillText('UVA/PADOVA · FDA VALIDATED', W - 12, HDR / 2);
  ctx.textAlign = 'left';

  // ── Left panel separator ──────────────────────────────
  ctx.strokeStyle = BORDER;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(LFT, HDR); ctx.lineTo(LFT, H - FTR); ctx.stroke();

  // ── Glucose big readout ───────────────────────────────
  const bigFS = Math.max(26, Math.round(H * 0.11));
  const readY = HDR + bigFS + H * 0.022;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';

  ctx.font = `bold ${bigFS}px "Courier New",monospace`;
  ctx.fillStyle = gColor;
  ctx.shadowColor = gColor; ctx.shadowBlur = 16;
  ctx.fillText(Math.round(gNow), LFT / 2, readY);
  ctx.shadowBlur = 0;

  ctx.font = `${Math.max(8, Math.round(bigFS * 0.30))}px "Courier New",monospace`;
  ctx.fillStyle = MUTED;
  ctx.fillText('mg/dL', LFT / 2, readY + bigFS * 0.46);

  ctx.font = `${Math.max(16, Math.round(bigFS * 0.52))}px sans-serif`;
  ctx.fillStyle = gColor;
  ctx.fillText(arrow, LFT / 2, readY + bigFS * 1.08);

  const sbFS = Math.max(8, Math.round(H * 0.022));
  ctx.font = `bold ${sbFS}px "Courier New",monospace`;
  ctx.fillStyle = gColor;
  ctx.fillText(statusTxt, LFT / 2, readY + bigFS * 1.64);

  // ── Left info block ───────────────────────────────────
  const div1Y = HDR + H * 0.38;
  ctx.strokeStyle = DIM;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(10, div1Y); ctx.lineTo(LFT - 10, div1Y); ctx.stroke();

  const iFS = Math.max(8, Math.round(H * 0.020));
  let iY = div1Y + H * 0.046;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  function info(label, val) {
    ctx.font = `${iFS}px "Courier New",monospace`;
    ctx.fillStyle = MUTED;
    ctx.fillText(label, 10, iY);
    iY += iFS * 1.5;
    ctx.font = `bold ${iFS + 1}px "Courier New",monospace`;
    ctx.fillStyle = WHITE;
    ctx.fillText(val, 10, iY);
    iY += iFS * 2.4;
  }

  info('PATIENT', '07 / 11');
  info('SIMULATIONS', '222 scénarios');

  const div2Y = iY - iFS * 0.5;
  ctx.strokeStyle = DIM;
  ctx.beginPath(); ctx.moveTo(10, div2Y); ctx.lineTo(LFT - 10, div2Y); ctx.stroke();
  iY = div2Y + H * 0.04;

  ctx.font = `bold ${iFS}px "Courier New",monospace`;
  if (isMeal && !isPID) {
    const blk = Math.sin(ts * 0.008) > 0;
    ctx.fillStyle = blk ? YELLOW : 'rgba(245,158,11,0.32)';
    ctx.fillText('⚠ MEAL EVENT', 10, iY);
    iY += iFS * 2;
    ctx.font = `${iFS}px "Courier New",monospace`;
    ctx.fillStyle = MUTED;
    ctx.fillText('Glycémie ↑ ↑', 10, iY);
  } else if (isPID) {
    ctx.fillStyle = BLUE;
    ctx.fillText('◎ PID ACTIF', 10, iY);
    iY += iFS * 2;
    ctx.font = `${iFS}px "Courier New",monospace`;
    ctx.fillStyle = MUTED;
    ctx.fillText('Insuline ↑', 10, iY);
  } else {
    ctx.fillStyle = GREEN;
    ctx.fillText('✓ STABLE', 10, iY);
    iY += iFS * 2;
    ctx.font = `${iFS}px "Courier New",monospace`;
    ctx.fillStyle = MUTED;
    ctx.fillText('Cible atteinte', 10, iY);
  }

  iY += iFS * 2.8;
  ctx.font = `${iFS}px "Courier New",monospace`;
  ctx.fillStyle = MUTED;
  ctx.fillText('CAPTEURS BLE', 10, iY);
  iY += iFS * 1.6;
  ctx.fillStyle = BLUE;
  ctx.fillText('● GSR · Cardio', 10, iY);

  // ── Y-axis labels (drawn outside clip region) ─────────
  const gridGs = [50, 70, 100, 140, 180, 240, 300];
  const lFS = Math.max(7, Math.round(H * 0.018));
  ctx.font = `${lFS}px "Courier New",monospace`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'right';
  gridGs.forEach(g => {
    const y = gy(g, cY, cH);
    const isTgt = g === 70 || g === 140;
    ctx.fillStyle = isTgt ? 'rgba(34,197,94,0.7)' : 'rgba(61,85,112,0.6)';
    ctx.fillText(g, cX - 5, y);
  });

  // ── Chart background ──────────────────────────────────
  ctx.fillStyle = PANEL;
  ctx.fillRect(cX, cY, cW, cH);

  // ── Clip + chart contents ────────────────────────────
  ctx.save();
  ctx.beginPath(); ctx.rect(cX, cY, cW, cH); ctx.clip();

  // Target band 70–140
  const yTop140 = gy(140, cY, cH);
  const yBot70  = gy(70, cY, cH);
  ctx.fillStyle = 'rgba(34,197,94,0.055)';
  ctx.fillRect(cX, yTop140, cW, yBot70 - yTop140);

  // Grid lines
  gridGs.forEach(g => {
    const y = gy(g, cY, cH);
    const isTgt = g === 70 || g === 140;
    ctx.strokeStyle = isTgt ? 'rgba(34,197,94,0.28)' : 'rgba(15,31,50,0.9)';
    ctx.lineWidth = isTgt ? 1 : 0.5;
    ctx.setLineDash(isTgt ? [4, 4] : []);
    ctx.beginPath(); ctx.moveTo(cX, y); ctx.lineTo(cR, y); ctx.stroke();
    ctx.setLineDash([]);
  });

  // HYPER / HYPO zone labels
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = `bold ${lFS}px "Courier New",monospace`;
  ctx.fillStyle = 'rgba(245,158,11,0.36)';
  ctx.fillText('HYPER', cX + 5, yTop140 - 3);
  ctx.fillStyle = 'rgba(239,68,68,0.36)';
  ctx.fillText('HYPO', cX + 5, cB - 3);

  // Glucose curve
  const tStart = Math.max(0, t - WINDOW);
  const tRange = t - tStart;
  const STEPS = 200;

  // Area fill under curve
  ctx.beginPath();
  let first = true;
  for (let i = 0; i <= STEPS; i++) {
    const ti = tStart + (i / STEPS) * tRange;
    const g = glucose(ti);
    const x = cX + ((ti - tStart) / WINDOW) * cW;
    const y = gy(g, cY, cH);
    if (first) { ctx.moveTo(x, cB); ctx.lineTo(x, y); first = false; }
    else ctx.lineTo(x, y);
  }
  const endX = cX + (tRange / WINDOW) * cW;
  ctx.lineTo(endX, cB);
  ctx.closePath();
  ctx.fillStyle = 'rgba(34,211,238,0.05)';
  ctx.fill();

  // Curve line — color changes with glucose zone
  ctx.beginPath();
  first = true;
  for (let i = 0; i <= STEPS; i++) {
    const ti = tStart + (i / STEPS) * tRange;
    const g = glucose(ti);
    const x = cX + ((ti - tStart) / WINDOW) * cW;
    const y = gy(g, cY, cH);
    if (first) { ctx.moveTo(x, y); first = false; }
    else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = CYAN;
  ctx.lineWidth = 2;
  ctx.shadowColor = CYAN; ctx.shadowBlur = 6;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Current value dot
  const nowX = cX + (tRange / WINDOW) * cW;
  const nowY = gy(gNow, cY, cH);
  ctx.fillStyle = gColor;
  ctx.shadowColor = gColor; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.arc(nowX, nowY, 5, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  // Insulin pulse markers
  if (isPID) {
    const pStep = 0.048;
    for (let p = 0.40; p < 0.77; p += pStep) {
      const px = cX + ((p - tStart) / WINDOW) * cW;
      if (px < cX || px > cR) continue;
      ctx.strokeStyle = 'rgba(96,165,250,0.5)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.moveTo(px, cB - 14); ctx.lineTo(px, cB); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = BLUE;
      ctx.beginPath();
      ctx.moveTo(px - 3, cB); ctx.lineTo(px + 3, cB); ctx.lineTo(px, cB - 7);
      ctx.closePath(); ctx.fill();
    }
    ctx.textAlign = 'left';
    ctx.font = `${lFS}px "Courier New",monospace`;
    ctx.fillStyle = 'rgba(96,165,250,0.46)';
    ctx.fillText('▼ bolus insuline', cX + 5, cB - 17);
  }

  // Left-edge fade (softens the start of data)
  const fadeGrad = ctx.createLinearGradient(cX, 0, cX + cW * 0.05, 0);
  fadeGrad.addColorStop(0, PANEL);
  fadeGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = fadeGrad;
  ctx.fillRect(cX, cY, cW * 0.05, cH);

  ctx.restore();

  // Chart border
  ctx.strokeStyle = BORDER;
  ctx.lineWidth = 1;
  ctx.strokeRect(cX, cY, cW, cH);

  // ── Time axis labels ──────────────────────────────────
  const ticks = [
    { frac: 0,    label: '-45m' },
    { frac: 1/3,  label: '-30m' },
    { frac: 2/3,  label: '-15m' },
    { frac: 1,    label: 'NOW'  },
  ];
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = `${lFS}px "Courier New",monospace`;
  ctx.fillStyle = MUTED;
  ticks.forEach(({ frac, label }) => {
    ctx.fillText(label, cX + frac * cW, cB + 4);
  });

  // ── Footer ────────────────────────────────────────────
  ctx.fillStyle = PANEL;
  ctx.fillRect(0, H - FTR, W, FTR);
  ctx.strokeStyle = BORDER;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, H - FTR); ctx.lineTo(W, H - FTR); ctx.stroke();

  const ftFS = Math.max(8, Math.round(FTR * 0.30));
  ctx.font = `${ftFS}px "Courier New",monospace`;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = MUTED;
  ctx.textAlign = 'left';
  ctx.fillText('RÉGULATEUR GLYCÉMIE · IUT BORDEAUX', 14, H - FTR / 2);

  ctx.textAlign = 'right';
  const simMin = Math.floor(t * 120);
  ctx.fillText(
    `SIM ${String(Math.floor(simMin / 60)).padStart(2, '0')}:${String(simMin % 60).padStart(2, '0')}`,
    W - 14, H - FTR / 2
  );
  ctx.textAlign = 'left';

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
